<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<title>Happy Birthday Baba Jaan ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#f4d27a;--warm:#fff6e5;--ink:#04060f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  background:radial-gradient(120% 90% at 50% 25%,#14338a 0%,#0a1a4a 38%,#04060f 100%) fixed;
  color:var(--warm);font-family:"Playfair Display",Georgia,"Times New Roman",serif;
  overflow-x:hidden;min-height:100svh;
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}

/* ---------- layout ---------- */
.stage{
  position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:clamp(8px,2.2vh,22px);
  padding:max(64px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom));
}
.rise{opacity:0;animation:rise 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}

/* ---------- title ---------- */
.title{position:relative;display:flex;flex-direction:column;align-items:center;line-height:1.05;font-weight:400}
.title::before{
  content:"";position:absolute;inset:-30% -10%;z-index:-1;
  background:radial-gradient(closest-side,rgba(244,210,122,.22),transparent 70%);
  animation:aura 4s ease-in-out infinite alternate;
}
.script{font-family:"Great Vibes","Brush Script MT","Segoe Script",cursive;font-weight:400}
.gold{
  background:linear-gradient(100deg,#b88a2a 0%,#fff1b8 25%,#f4d27a 45%,#b88a2a 62%,#fff1b8 82%,#c9a13b 100%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  animation:shine 5s ease-in-out infinite alternate;
}
.title .script{font-size:clamp(2.7rem,12vw,5.8rem);padding:.05em .15em}
.name-row{display:flex;align-items:center;justify-content:center;gap:.3em}
.name{font-size:clamp(1.9rem,8vw,3.7rem);font-weight:600;letter-spacing:.07em}
.heart{font-size:clamp(1.6rem,6.5vw,3rem);animation:beat 1.4s ease-in-out infinite}
.date{
  display:flex;align-items:center;gap:14px;color:var(--gold);
  font-size:clamp(.9rem,3.5vw,1.25rem);letter-spacing:.3em;text-transform:uppercase;
}
.date span{width:clamp(26px,12vw,80px);height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.date span:last-child{transform:scaleX(-1)}

/* ---------- cake ---------- */
.cake-wrap{position:relative;width:min(84vw,390px,calc(38svh * 400 / 340));aspect-ratio:400/340}
.cake-wrap::before{
  content:"";position:absolute;inset:-22%;z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,rgba(244,210,122,.26),transparent 70%);
  animation:aura 4s ease-in-out infinite alternate;
}
.cake{
  width:100%;height:100%;overflow:visible;cursor:pointer;
  filter:drop-shadow(0 18px 22px rgba(0,0,0,.5));
  animation:float 6s ease-in-out 2.4s infinite;
}
.tier{opacity:0;animation:drop .9s cubic-bezier(.2,.9,.3,1.15) forwards;animation-delay:calc(.15s + var(--k) * .3s)}
.cand{opacity:0;animation:fadeIn .8s ease 1.4s forwards}

.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.glow{animation:glow 1.4s ease-in-out infinite alternate}
.fl{transition:opacity .45s ease calc(var(--i,0) * .08s)}
.out .fl{opacity:0}
.smoke{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center}
.out .smoke{animation:smoke 2.2s ease-out forwards;animation-delay:calc(var(--i,0) * .1s + .25s)}

.wish{
  position:absolute;left:0;right:0;top:-8%;z-index:3;pointer-events:none;
  font-size:clamp(1.5rem,6.5vw,2.2rem);color:var(--gold);text-shadow:0 0 18px rgba(244,210,122,.7);
  opacity:0;transform:translateY(12px);transition:opacity .6s,transform .6s;
}
.wish.show{opacity:1;transform:none}

/* ---------- buttons ---------- */
.actions{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.btn{
  font:inherit;cursor:pointer;border:0;border-radius:999px;padding:.95em 1.8em;min-height:48px;
  font-size:clamp(.95rem,3.8vw,1.1rem);letter-spacing:.05em;transition:transform .2s,box-shadow .3s,background .3s;
}
.btn:active{transform:scale(.96)}
.btn:focus-visible,.music:focus-visible{outline:2px solid #fff1b8;outline-offset:3px}
.primary{
  position:relative;overflow:hidden;color:#1a1204;font-weight:600;
  background:linear-gradient(135deg,#fff1b8,#f4d27a 40%,#c9a13b);
  box-shadow:inset 0 0 0 1px rgba(255,241,184,.7),0 10px 30px rgba(201,161,59,.4);
  animation:pulse 2.4s ease-in-out infinite;
}
.primary::after{
  content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);
  animation:sweep 3.4s ease-in-out infinite;
}
.ghost{color:var(--gold);background:rgba(255,255,255,.04);border:1px solid rgba(244,210,122,.5)}
.ghost:hover{background:rgba(244,210,122,.12)}

.music{
  position:fixed;z-index:20;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));
  display:flex;align-items:center;gap:8px;min-height:44px;padding:.5em 1em;border-radius:999px;cursor:pointer;
  font:inherit;font-size:.85rem;color:var(--gold);background:rgba(4,6,15,.55);border:1px solid rgba(244,210,122,.5);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;height:4px;background:var(--gold);border-radius:2px}
.music.on .eq i{animation:eq .8s ease-in-out infinite alternate}
.music.on .eq i:nth-child(2){animation-delay:-.3s}
.music.on .eq i:nth-child(3){animation-delay:-.6s}

/* ---------- surprise overlay ---------- */
.overlay{
  position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;overflow-y:auto;
  background:radial-gradient(circle at 50% 40%,rgba(20,51,138,.88),rgba(4,6,15,.95));
  opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s;
}
.overlay.show{opacity:1;visibility:visible}
.card{
  width:100%;max-width:560px;text-align:center;border-radius:28px;
  padding:clamp(26px,6vw,46px) clamp(20px,6vw,44px);
  background:linear-gradient(160deg,rgba(255,246,229,.09),rgba(255,246,229,.02));
  border:1px solid rgba(244,210,122,.55);
  box-shadow:0 0 60px rgba(244,210,122,.2),inset 0 0 40px rgba(244,210,122,.06);
  transform:translateY(30px) scale(.94);transition:transform .8s cubic-bezier(.2,.9,.3,1.2);
}
.overlay.show .card{transform:none}
.big-heart{font-size:clamp(2.6rem,12vw,3.8rem);animation:beat 1.3s ease-in-out infinite}
.card h2{font-size:clamp(2.2rem,9.5vw,3.6rem);line-height:1.15;margin:.1em 0 .35em;padding:.05em .1em}
.msg{font-size:clamp(1.05rem,4.4vw,1.35rem);line-height:1.7;max-width:34ch;margin:0 auto}
.w{display:inline-block;opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s;transition-delay:calc(var(--i) * .09s + 1.1s)}
.overlay.show .w{opacity:1;transform:none}
.overlay:not(.show) .w{transition-delay:0s}
.sign{margin:.9em 0 1.2em;font-size:clamp(1.5rem,6vw,2rem);color:var(--gold)}
.card-actions{display:flex;flex-direction:column;align-items:center;gap:10px}

/* ---------- keyframes ---------- */
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes aura{from{opacity:.55;transform:scale(.95)}to{opacity:1;transform:scale(1.05)}}
@keyframes shine{from{background-position:0 0}to{background-position:100% 0}}
@keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}100%{transform:scale(.9,1.1) rotate(2.5deg)}}
@keyframes glow{from{opacity:.65}to{opacity:1}}
@keyframes smoke{0%{opacity:.5;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-34px) scale(3)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,241,184,.7),0 10px 30px rgba(201,161,59,.35)}50%{box-shadow:inset 0 0 0 1px rgba(255,241,184,.7),0 10px 44px rgba(244,210,122,.65)}}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
@keyframes eq{from{height:3px}to{height:14px}}

/* ---------- small / short screens ---------- */
@media (max-height:640px){.stage{gap:6px;padding-top:56px}.btn{padding:.7em 1.4em}}
@media (min-width:700px){.actions,.card-actions{flex-direction:row;justify-content:center}.actions{width:auto}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>

<button id="musicBtn" class="music" type="button" aria-pressed="false" aria-label="Turn music on or off">
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
  <span class="lbl">Music Off</span>
</button>

<main class="stage">
  <header class="head">
    <h1 class="title rise" style="--t:.2s">
      <span class="gold script">Happy Birthday</span>
      <span class="name-row"><span class="gold name">Baba Jaan</span> <span class="heart" aria-hidden="true">❤️</span></span>
    </h1>
    <p class="date rise" style="--t:.5s"><span></span>10th October 2026<span></span></p>
  </header>

  <div class="cake-wrap" id="cakeWrap">
    <div class="wish script" id="wish" aria-live="polite">Make a wish ✨</div>
    <svg class="cake" id="cake" viewBox="0 8 400 340" role="img" aria-label="A three-tier birthday cake with glowing candles">
      <defs>
        <linearGradient id="gold"><stop offset="0" stop-color="#9a7420"/><stop offset=".3" stop-color="#fff1b8"/><stop offset=".6" stop-color="#d4a93f"/><stop offset="1" stop-color="#8a6518"/></linearGradient>
        <linearGradient id="blueSide"><stop offset="0" stop-color="#071a52"/><stop offset=".3" stop-color="#2f5bd6"/><stop offset=".6" stop-color="#1b3f9e"/><stop offset="1" stop-color="#06143f"/></linearGradient>
        <linearGradient id="creamSide"><stop offset="0" stop-color="#c9bb9c"/><stop offset=".35" stop-color="#fffaf0"/><stop offset=".7" stop-color="#eadfc4"/><stop offset="1" stop-color="#bfae8c"/></linearGradient>
        <linearGradient id="creamTop" x2="0" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#efe2c4"/></linearGradient>
        <linearGradient id="plateIn" x2="0" y2="1"><stop offset="0" stop-color="#0d2466"/><stop offset="1" stop-color="#050c26"/></linearGradient>
        <linearGradient id="candleG"><stop offset="0" stop-color="#e3d3ad"/><stop offset=".45" stop-color="#fff8e8"/><stop offset="1" stop-color="#d8c79f"/></linearGradient>
        <linearGradient id="flameG" x2="0" y2="1"><stop offset="0" stop-color="#ff8f1f"/><stop offset=".55" stop-color="#ffd35c"/><stop offset="1" stop-color="#fff6c8"/></linearGradient>
        <radialGradient id="glowG"><stop offset="0" stop-color="#ffd978" stop-opacity=".6"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
        <path id="hrt" d="M0 5 C-9 -2 -7 -10 0 -5 C7 -10 9 -2 0 5Z"/>
      </defs>

      <g class="tier" style="--k:0">
        <ellipse cx="200" cy="320" rx="184" ry="22" fill="#000" opacity=".35"/>
        <ellipse cx="200" cy="312" rx="174" ry="24" fill="url(#gold)"/>
        <ellipse cx="200" cy="310" rx="160" ry="20" fill="url(#plateIn)"/>
      </g>

      <g class="tier" style="--k:1">
        <path d="M70 222 v82 a130 24 0 0 0 260 0 v-82z" fill="url(#blueSide)"/>
        <ellipse cx="200" cy="222" rx="130" ry="24" fill="url(#creamTop)" stroke="url(#gold)" stroke-width="1.5"/>
        <path d="M70 262 a130 24 0 0 0 260 0" fill="none" stroke="url(#gold)" stroke-width="3"/>
        <path d="M70 262 a130 24 0 0 0 260 0" fill="none" stroke="#fff4cf" stroke-width="5" stroke-dasharray="0 11" stroke-linecap="round"/>
      </g>

      <g class="tier" style="--k:2">
        <path d="M105 154 v68 a95 18 0 0 0 190 0 v-68z" fill="url(#creamSide)"/>
        <ellipse cx="200" cy="154" rx="95" ry="18" fill="url(#creamTop)" stroke="url(#gold)" stroke-width="1.5"/>
        <path d="M105 196 a95 18 0 0 0 190 0" fill="none" stroke="url(#gold)" stroke-width="3"/>
        <g fill="#d4a93f">
          <use href="#hrt" x="145" y="185"/><use href="#hrt" x="172" y="187"/><use href="#hrt" x="200" y="188"/><use href="#hrt" x="228" y="187"/><use href="#hrt" x="255" y="185"/>
        </g>
      </g>

      <g class="tier" style="--k:3">
        <path d="M140 92 v62 a60 12 0 0 0 120 0 v-62z" fill="url(#blueSide)"/>
        <ellipse cx="200" cy="92" rx="60" ry="12" fill="url(#creamTop)" stroke="url(#gold)" stroke-width="1.5"/>
        <path d="M140 132 a60 12 0 0 0 120 0" fill="none" stroke="url(#gold)" stroke-width="3"/>
        <path d="M140 132 a60 12 0 0 0 120 0" fill="none" stroke="#fff4cf" stroke-width="4" stroke-dasharray="0 9" stroke-linecap="round"/>
      </g>

      <g id="candles" class="cand"></g>
    </svg>
  </div>

  <div class="actions rise" style="--t:1.7s">
    <button id="surpriseBtn" class="btn primary" type="button">Open Your Birthday Surprise</button>
    <button id="blowBtn" class="btn ghost" type="button">💨 Blow the Candles</button>
  </div>
</main>

<section class="overlay" id="overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="msgTitle">
  <div class="card">
    <div class="big-heart" aria-hidden="true">❤️</div>
    <h2 id="msgTitle" class="gold script">Happy Birthday, Baba Jaan!</h2>
    <p class="msg" id="msg">May your life always be filled with happiness, health, love, and countless blessings. ❤️</p>
    <p class="sign script">With all my love</p>
    <div class="card-actions">
      <button id="moreBtn" class="btn primary" type="button">Celebrate Again 🎉</button>
      <button id="closeBtn" class="btn ghost" type="button">Back to the Cake</button>
    </div>
  </div>
</section>

<script>
(() => {
'use strict';

const $ = (s) => document.querySelector(s);
const cv = $('#fx'), ctx = cv.getContext('2d');
const cake = $('#cake'), overlay = $('#overlay'), wish = $('#wish');
const blowBtn = $('#blowBtn'), surpriseBtn = $('#surpriseBtn');
const closeBtn = $('#closeBtn'), moreBtn = $('#moreBtn'), musicBtn = $('#musicBtn');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a, b) => a + Math.random() * (b - a);

/* ================= Candles ================= */
const xs = [164, 182, 200, 218, 236];
$('#candles').innerHTML = xs.map((x, i) => `
<g style="--i:${i}">
  <rect x="${x - 3.5}" y="64" width="7" height="38" rx="2" fill="url(#candleG)"/>
  <rect x="${x - 3.5}" y="74" width="7" height="4" fill="#2f5bd6" opacity=".85"/>
  <rect x="${x - 3.5}" y="86" width="7" height="4" fill="#2f5bd6" opacity=".85"/>
  <path d="M${x} 64 v-5" stroke="#3a2a14" stroke-width="1.4" stroke-linecap="round"/>
  <g class="fl" transform="translate(${x} 59)">
    <circle class="glow" cy="-13" r="22" fill="url(#glowG)"/>
    <g class="flame" style="--d:${(-i * 0.07).toFixed(2)}s">
      <path d="M0 0 C7 -6 7 -17 0 -28 C-7 -17 -7 -6 0 0Z" fill="url(#flameG)"/>
      <path d="M0 -1 C3 -4 3 -9 0 -15 C-3 -9 -3 -4 0 -1Z" fill="#fffbe6" opacity=".9"/>
    </g>
  </g>
  <circle class="smoke" cx="${x}" cy="54" r="4"/>
</g>`).join('');

/* ================= Canvas particles ================= */
let W = 0, H = 0, small = false;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; small = W < 600;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function sprite(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  return c;
}
function heartPath(g, s, x, y) {
  g.beginPath();
  g.moveTo(x, y + s * .35);
  g.bezierCurveTo(x - s * .6, y - s * .05, x - s * .35, y - s * .55, x, y - s * .2);
  g.bezierCurveTo(x + s * .35, y - s * .55, x + s * .6, y - s * .05, x, y + s * .35);
  g.closePath();
}
const heartSprite = (fill, rgb) => sprite(64, (g, s) => {
  const c = s / 2, r = g.createRadialGradient(c, c, 0, c, c, c);
  r.addColorStop(0, `rgba(${rgb},.5)`); r.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = r; g.fillRect(0, 0, s, s);
  g.fillStyle = fill; heartPath(g, s * .5, c, c); g.fill();
});
const S = {
  dust: sprite(32, (g, s) => {
    const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    r.addColorStop(0, 'rgba(255,241,184,1)'); r.addColorStop(.35, 'rgba(244,210,122,.55)'); r.addColorStop(1, 'rgba(244,210,122,0)');
    g.fillStyle = r; g.fillRect(0, 0, s, s);
  }),
  star: sprite(48, (g, s) => {
    const c = s / 2, r = g.createRadialGradient(c, c, 0, c, c, c);
    r.addColorStop(0, 'rgba(255,250,225,.9)'); r.addColorStop(1, 'rgba(255,230,150,0)');
    g.fillStyle = r; g.fillRect(0, 0, s, s);
    g.fillStyle = '#fffbe8'; g.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 - Math.PI / 2, rad = i % 2 ? c * .14 : c * .62;
      g.lineTo(c + Math.cos(a) * rad, c + Math.sin(a) * rad);
    }
    g.closePath(); g.fill();
  }),
  heartR: heartSprite('#ff6f91', '255,111,145'),
  heartG: heartSprite('#f7d98a', '244,210,122'),
};

const P = [];
const COLORS = ['#f4d27a', '#fff1b8', '#2f5bd6', '#fff6e5', '#c9a13b', '#ff6f91', '#7aa2ff'];
let celebrating = false, rain = 0;

function ambient(init) {
  const t = Math.random(), k = t < .5 ? 'dust' : t < .75 ? 'star' : 'heart';
  return {
    k: 'spr', amb: true, x: rnd(0, W), y: init ? rnd(0, H) : H + 30,
    vx: rnd(-6, 6), vy: -rnd(10, 32), ph: rnd(0, 6.28), sp: rnd(1, 3), a: rnd(.4, .9),
    s: k === 'dust' ? rnd(6, 16) : k === 'star' ? rnd(10, 22) : rnd(14, 26),
    img: k === 'heart' ? (Math.random() < .5 ? S.heartR : S.heartG) : S[k],
  };
}
function seedAmbient() {
  const n = reduce ? 10 : small ? 34 : 70;
  for (let i = 0; i < n; i++) P.push(ambient(true));
}
seedAmbient();

function confetti(x, y, n, spread = Math.PI * 2, dir = -Math.PI / 2) {
  if (reduce) n = Math.ceil(n / 3);
  for (let i = 0; i < n; i++) {
    const a = dir + rnd(-spread / 2, spread / 2), v = rnd(260, 720);
    P.push({ k: 'conf', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: rnd(6, 11), h: rnd(3, 6),
      r: rnd(0, 6.28), vr: rnd(-9, 9), c: COLORS[i % COLORS.length], life: rnd(2.8, 4.4), t: 0 });
  }
}
function sparks(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.28), v = rnd(40, 200);
    P.push({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, s: rnd(10, 22), life: rnd(.9, 1.6), t: 0,
      img: Math.random() < .6 ? S.star : S.dust });
  }
}
function risingHearts(n) {
  for (let i = 0; i < n; i++) {
    P.push({ k: 'rise', x: rnd(10, W - 10), y: H + 30, vy: -rnd(90, 220), sw: rnd(10, 30), ph: rnd(0, 6.28),
      s: rnd(22, 46), life: 99, t: 0, img: Math.random() < .6 ? S.heartR : S.heartG });
  }
}

let last = 0, running = true;
function frame(ts) {
  if (!running) return;
  const dt = Math.min((ts - last) / 1000 || 0, .05); last = ts;
  const T = ts / 1000;
  ctx.clearRect(0, 0, W, H);

  if (celebrating && !reduce) {
    rain += dt;
    if (rain > (small ? .3 : .18)) { rain = 0; risingHearts(1); }
  }
  if (P.length > 520) P.splice(0, P.length - 520 > 0 ? 40 : 0);

  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    if (p.k === 'spr') {
      p.x += (p.vx + Math.sin(T * .6 + p.ph) * 8) * dt; p.y += p.vy * dt;
      if (p.y < -30) { P[i] = ambient(false); continue; }
      ctx.globalAlpha = p.a * (.55 + .45 * Math.sin(T * p.sp + p.ph));
      ctx.drawImage(p.img, p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    } else if (p.k === 'rise') {
      p.t += dt; p.y += p.vy * dt;
      if (p.y < -60) { P[i] = P[P.length - 1]; P.pop(); continue; }
      ctx.globalAlpha = Math.min(1, p.t * 2) * .95;
      ctx.drawImage(p.img, p.x + Math.sin(T * 1.6 + p.ph) * p.sw - p.s, p.y - p.s, p.s * 2, p.s * 2);
    } else if (p.k === 'spark') {
      p.t += dt;
      if (p.t > p.life) { P[i] = P[P.length - 1]; P.pop(); continue; }
      p.vx *= 1 - 1.5 * dt; p.vy *= 1 - 1.5 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.drawImage(p.img, p.x - p.s, p.y - p.s, p.s * 2, p.s * 2);
    } else {
      p.t += dt;
      if (p.t > p.life || p.y > H + 30) { P[i] = P[P.length - 1]; P.pop(); continue; }
      p.vx *= 1 - 1.9 * dt; p.vy += (420 - p.vy * 1.9) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      ctx.globalAlpha = Math.min(1, (p.life - p.t) * 1.5);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.cos(p.r * 1.7));
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================= Candle blowing ================= */
let lit = true;
function candlePoint() {
  const r = cake.getBoundingClientRect();
  return [r.left + r.width / 2, r.top + r.height * .16];
}
function blow() {
  if (!lit) return;
  lit = false;
  cake.classList.add('out');
  blowBtn.textContent = '🕯️ Relight the Candles';
  wish.classList.add('show');
  const [x, y] = candlePoint();
  sparks(x, y, small ? 24 : 40);
  confetti(x, y, small ? 30 : 50, Math.PI * .9);
  clearTimeout(blow.t);
  blow.t = setTimeout(() => wish.classList.remove('show'), 3200);
}
function relight() {
  lit = true;
  cake.classList.remove('out');
  wish.classList.remove('show');
  blowBtn.textContent = '💨 Blow the Candles';
}
const toggleCandles = () => (lit ? blow() : relight());
blowBtn.addEventListener('click', toggleCandles);
cake.addEventListener('click', toggleCandles);

/* ================= Surprise ================= */
const msg = $('#msg');
msg.innerHTML = msg.textContent.trim().split(/\s+/).map((w, i) => `<span class="w" style="--i:${i}">${w}</span>`).join(' ');

function celebrate() {
  const n = small ? 60 : 110;
  confetti(0, H * .8, n, Math.PI * .5, -Math.PI * .3);
  confetti(W, H * .8, n, Math.PI * .5, -Math.PI * .7);
  confetti(W / 2, H * .55, n, Math.PI * 1.6);
  risingHearts(small ? 10 : 18);
  sparks(W / 2, H * .4, 40);
}
function openSurprise() {
  startMusic();
  const wasLit = lit;
  if (wasLit) blow();
  setTimeout(() => {
    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden', 'false');
    celebrating = true;
    celebrate();
    setTimeout(() => celebrating && confetti(W / 2, H * .5, small ? 50 : 90, Math.PI * 2), 1400);
    closeBtn.focus({ preventScroll: true });
  }, wasLit ? 900 : 150);
}
function closeSurprise() {
  overlay.classList.remove('show');
  overlay.setAttribute('aria-hidden', 'true');
  celebrating = false;
  surpriseBtn.focus({ preventScroll: true });
}
surpriseBtn.addEventListener('click', openSurprise);
moreBtn.addEventListener('click', celebrate);
closeBtn.addEventListener('click', closeSurprise);
addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('show')) closeSurprise(); });

/* ================= Music (synthesized, no files needed) ================= */
let ac = null, master = null, bus = null, musicOn = false, timer = 0, voices = [];
const BEAT = .66;
const TUNE = [
  [392, .75], [392, .25], [440, 1], [392, 1], [523.25, 1], [493.88, 2],
  [392, .75], [392, .25], [440, 1], [392, 1], [587.33, 1], [523.25, 2],
  [392, .75], [392, .25], [783.99, 1], [659.25, 1], [523.25, 1], [493.88, 1], [440, 1],
  [698.46, .75], [698.46, .25], [659.25, 1], [523.25, 1], [587.33, 1], [523.25, 2],
];

function initAudio() {
  if (ac) return true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  ac = new AC();
  master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
  bus = ac.createGain(); bus.connect(master);
  const delay = ac.createDelay(); delay.delayTime.value = .32;
  const fb = ac.createGain(); fb.gain.value = .32;
  const wet = ac.createGain(); wet.gain.value = .45;
  bus.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
  return true;
}
function note(f, t, d) {
  [[f, 'sine', .22], [f * 2, 'sine', .05], [f / 2, 'triangle', .07]].forEach(([fr, type, v]) => {
    const o = ac.createOscillator(), g = ac.createGain(), end = t + d * 1.6 + .5;
    o.type = type; o.frequency.value = fr;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, end);
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(end + .1);
    voices.push(o);
    o.onended = () => { const i = voices.indexOf(o); if (i > -1) voices.splice(i, 1); };
  });
}
function playLoop() {
  if (!musicOn) return;
  let t = ac.currentTime + .1;
  TUNE.forEach(([f, b]) => { note(f, t, b * BEAT); t += b * BEAT; });
  timer = setTimeout(playLoop, (t - ac.currentTime + 1.5) * 1000);
}
function paintMusic() {
  musicBtn.classList.toggle('on', musicOn);
  musicBtn.setAttribute('aria-pressed', String(musicOn));
  musicBtn.querySelector('.lbl').textContent = musicOn ? 'Music On' : 'Music Off';
}
function startMusic() {
  if (musicOn || !initAudio()) return;
  musicOn = true;
  ac.resume();
  master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.setTargetAtTime(.6, ac.currentTime, .3);
  playLoop();
  paintMusic();
}
function stopMusic() {
  if (!musicOn) return;
  musicOn = false;
  clearTimeout(timer);
  master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.setTargetAtTime(0, ac.currentTime, .08);
  const old = voices.splice(0);
  setTimeout(() => old.forEach((o) => { try { o.stop(); } catch (e) {} }), 400);
  paintMusic();
}
musicBtn.addEventListener('click', () => (musicOn ? stopMusic() : startMusic()));

// Music begins only after the person first touches or clicks the page.
let touched = false;
addEventListener('pointerdown', (e) => {
  if (touched) return;
  touched = true;
  if (!e.target.closest('#musicBtn')) startMusic();
}, { passive: true });

/* ================= Pause when tab is hidden ================= */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false;
    if (ac && musicOn) ac.suspend();
  } else {
    running = true; last = performance.now(); requestAnimationFrame(frame);
    if (ac && musicOn) ac.resume();
  }
});
})();
</script>
